name: gstore
description: "github 资源的应用商店"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.38+1

environment:
  sdk: ^3.5.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Flutter's Cupertino widgets reference this icon font; keep it so icon
  # tree-shaking can retain the glyphs actually used.
  cupertino_icons: ^1.0.8
  retrofit: ^4.4.0
  logger: ^2.4.0  # for logging purpose
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.2.0
  # 代码编辑/高亮（re_editor 自带只读、折叠、行号、大文本优化）
  re_editor: ^0.10.0
  # re_editor 的语法高亮引擎；直接 import 语言/主题需显式声明
  re_highlight: ^0.0.3
  # 联网检索：HTML 正文抽取（webFetch）
  html: ^0.15.4
  async: ^2.11.0

  http: ^1.2.2
  cached_network_image: ^3.4.1

  installed_apps:
    git:
      url: https://github.com/sunO2/installed_apps.git
      ref: 8d4861f4acf879840642351cb6d008157955f7ba
  jovial_svg: any
  path_provider: any
  crypto: any
  dio: any
  rhttp: ^0.15.1
  dynamic_color: ^1.7.0
  floor: ^1.4.2
  shared_preferences: ^2.3.2
  sprintf: "^7.0.0"
  flutter_inappwebview: ^6.1.5
  qr_flutter: ^4.1.0
  pretty_dio_logger: ^1.4.0
  flutter_html: ^3.0.0-beta.2
  sqflite: ^2.4.1
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.6
  archive: ^3.6.1


  flutter_rust_bridge: 2.11.1
  path: any
  xml: ^6.5.0
  genkit: ^1.0.3
  genkit_google_genai: ^1.2.0
  genkit_openai: ^1.0.3
  # 工具 function-calling 的 JSON Schema 构造（genkit 的传递依赖，显式引入）
  schemantic: ^1.0.0
  # OpenAI 兼容模型目录探测（openai_model_catalog 直接用 OpenAIClient）
  openai_dart: ^11.0.1
  device_info_plus: ^12.4.0
  shizuku_api:
    path: packages/shizuku_api
  flutter_local_notifications: ^22.2.0
  flutter_foreground_task: ^10.0.0
  flutter_gen_ai_chat_ui: ^2.15.0
  flutter_svg: ^2.3.0
  flutter_tabler_icons: ^1.43.0
  package_info_plus: ^8.0.0
  gal: ^2.3.3
  camera: ^0.12.1
  protobuf: ^3.1.0
  genkit_middleware: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  retrofit_generator: '>=8.0.0 <10.0.0' # for Dart 3.3 use ^9.0.0
  build_runner: ^2.3.3
  json_serializable: ^6.8.0
  floor_generator: ^1.4.2

  # Rust FFI
  flutter_lints: ^4.0.0
  sqflite_common_ffi: 2.3.4+4
  mockito: ^5.4.4
  # 开源许可清单生成（dart run dart_pubspec_licenses:generate → lib/oss_licenses.dart）
  dart_pubspec_licenses: ^3.0.12

# Rust FFI 配置
  sqlite3: any
  flutter_secure_storage_platform_interface: any
  path_provider_platform_interface: any
  fake_async: any
flutter_rust_bridge:
  # Rust 输入（模块路径）
  rust_input: gstore_host::bridge
  # Rust 项目根目录
  rust_root: rust/gstore_host
  # Dart 输出目录
  dart_output: lib/core/rust/generated/
  # Rust 输出文件
  rust_output: rust/gstore_host/src/frb_generated.rs


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/app/
     - assets/auth/
     - assets/skills/app-recommendation/SKILL.md
     - assets/skills/download-install-flow/SKILL.md
     - assets/skills/app-update-check/SKILL.md
     - assets/skills/backup-restore/SKILL.md
     - assets/skills/installed-apps-management/SKILL.md
     - assets/skills/sensitive-operations-and-choices/SKILL.md
     - assets/skills/download-management/SKILL.md
     - assets/skills/fdroid-repository/SKILL.md
     - assets/skills/webdav-cloud-backup/SKILL.md
     - assets/skills/app-config-management/SKILL.md
     - assets/skills/troubleshooting/SKILL.md
     - assets/skills/js-channel-app-operations/SKILL.md
     - assets/skills/js-channel-development/SKILL.md
     - assets/skills/js-channel-method-execution/SKILL.md
     - assets/skills/version-diff-analysis/SKILL.md
     - assets/app/db/
     - assets/channels/
     - assets/lcrules/
     - assets/licenses/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: AliIconFont
      fonts:
        - asset: assets/font/icon/iconfont.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  dynamic_color:
    path: third_party/dynamic_color
  rhttp:
    path: third_party/rhttp
