plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.suno2.gstore"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // coreLibraryDesugaring 需要 Java 11+
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    // 读取 flutter build 的 --target-platform 参数，动态过滤 jniLibs 的 ABI。
    // 未指定参数时不设 abiFilters（与 Flutter 默认全 ABI 行为一致）。
    def flutterAbiFilters = []
    if (project.hasProperty('target-platform')) {
        def platformAbiMap = [
            'android-arm':   'armeabi-v7a',
            'android-arm64': 'arm64-v8a',
            'android-x64':   'x86_64',
        ]
        flutterAbiFilters = project.property('target-platform').split(',').collect { platformAbiMap[it] }.findAll { it != null }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.suno2.gstore"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 按 --target-platform 动态过滤 jniLibs ABI（与 Flutter 引擎行为一致）
        if (!flutterAbiFilters.isEmpty()) {
            ndk {
                abiFilters = flutterAbiFilters
            }
        }
    }

    // 指定 jniLibs 目录位置
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }


    signingConfigs {
        debug {
            keyAlias 'GStore'
            keyPassword 'gstore199406'
            storeFile file('../keystore/GStore')
            storePassword 'gstore199406'
        }
        release {
            keyAlias 'GStore'
            keyPassword 'gstore199406'
            storeFile file('../keystore/GStore')
            storePassword 'gstore199406'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }

        debug {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

configurations.all {
    resolutionStrategy{
    //   force 'androidx.core:core:1.5.0'
    //   force 'androidx.core:core-ktx:1.5.0'
    }
}

flutter {
    source = "../.."
}

dependencies {
    // core library desugaring（flutter_local_notifications 需要）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
