plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.suno2.gstore"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // coreLibraryDesugaring 需要 Java 11+
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    // 使用 Flutter 的 --target-platform/--split-per-abi 自动管理 ABI：
    // 此处不设 abiFilters，避免与 --split-per-abi 的 splits.abi 冲突
    //（split-per-abi 已按 ABI 正确打包 hand-placed jniLibs）。

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.suno2.gstore"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // 指定 jniLibs 目录位置
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // 可选「精简包」开关：CI 通过 ORG_GRADLE_PROJECT_gstoreSlimModules=true 传入，
    // Gradle 会映射为同名项目属性 gstoreSlimModules。开启后打包时排除可下载的原生
    // 模块库 libgstore_mod_*.so，但保留 FFI 宿主 libgstore_host.so 及其它所有 .so。
    // 说明：Dart 模块加载器把 modules_builtin.json 中的 "builtin" 声明视为「需要真实
    // 产物」，精简包中该产物缺失时首次使用会回退到远程下载链路；属性缺省或为 false
    // 时打包内容与完整包完全一致（字节不变）。
    if (project.hasProperty("gstoreSlimModules") &&
            project.property("gstoreSlimModules").toString().toBoolean()) {
        packaging {
            jniLibs {
                excludes += ["**/libgstore_mod_*.so"]
            }
        }
    }

    signingConfigs {
        debug {
            keyAlias 'GStore'
            keyPassword 'gstore199406'
            storeFile file('../keystore/GStore')
            storePassword 'gstore199406'
        }
        release {
            keyAlias 'GStore'
            keyPassword 'gstore199406'
            storeFile file('../keystore/GStore')
            storePassword 'gstore199406'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }

        debug {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

configurations.all {
    resolutionStrategy{
    //   force 'androidx.core:core:1.5.0'
    //   force 'androidx.core:core-ktx:1.5.0'
    }
}

flutter {
    source = "../.."
}

dependencies {
    // core library desugaring（flutter_local_notifications 需要）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
