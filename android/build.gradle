allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                // AGP 9 / Flutter 3.50 下依赖 AAR 要求 compileSdk >= 36；
                // 统一抬高插件模块，避免逐个 vendor 修改。
                if (project.android.hasProperty("compileSdk")) {
                    compileSdk = 36
                } else {
                    compileSdkVersion = 36
                }
                if (namespace == null) {
                    namespace = project.group
                }
                // AGP 9 lint 在部分插件源码上会崩溃（camera_android_camerax），
                // 先关闭 lint 阻断；lintVital 任务在下方统一禁用。
                lint {
                    checkReleaseBuilds = false
                    abortOnError = false
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 9 lintVital 在部分插件源码上崩溃；升级验证阶段先禁用，后续单独恢复。
subprojects {
    tasks.configureEach { task ->
        if (task.name.startsWith("lintVital")) {
            task.enabled = false
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
