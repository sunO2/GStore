[package]
name = "gstore_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "gstore_core"
crate-type = ["rlib"]

[dependencies]
gstore_contract = { path = "../gstore_contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", default-features = false, features = ["rusqlite"] }
log = "0.4"

[profile.release]
panic = "abort"