# Fully synthetic subscription fixture for gstore_mod_proxy tests.
#
# EVERY value in this file is fabricated for testing only: hostnames end in
# `.example.com` (RFC 2606 reserved), UUIDs are sequential patterns, and all
# keys/passwords/tokens are obvious fakes. Do not replace these with real
# subscription content.
#
# Shape (mirrors a Clash/mihomo provider document without copying any real one):
#   * 16 `type: vless` nodes — all xtls-rprx-vision + tls + servername +
#     client-fingerprint; exactly 4 use `network: ws` (+ ws-opts), exactly 4
#     carry fabricated `reality-opts`.
#   * 8 importable `type: hysteria2` nodes — password/sni/skip-cert-verify;
#     some with `obfs: salamander` + `obfs-password`; some with `up`/`down`.
#     One of them (`hy2-hop-port`) exercises the port-hopping edge with a
#     `ports:` range *together with* a fixed `port`.
#   * 1 extra hysteria2 node (`hy2-no-port`) with a `ports:` range but no fixed
#     `port` — the canonical model requires a non-zero `port`, so it is dropped
#     at import (asserted in tests).
#   * 3 proxy-groups: select (`PROXY`), url-test (`AUTO`), fallback (`FALLBACK`).

port: 7890
socks-port: 7891
mode: rule
log-level: warning

proxies:
  # -------- VLESS over TCP (vless-01 .. vless-08) --------
  - {name: "vless-01", type: vless, server: node01.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000001", flow: xtls-rprx-vision, tls: true, servername: www.example.com, client-fingerprint: chrome, network: tcp}
  - {name: "vless-02", type: vless, server: node02.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000002", flow: xtls-rprx-vision, tls: true, servername: cdn.example.com, client-fingerprint: firefox, network: tcp}
  - {name: "vless-03", type: vless, server: node03.example.com, port: 8443, uuid: "11111111-1111-1111-1111-000000000003", flow: xtls-rprx-vision, tls: true, servername: www.example.com, client-fingerprint: safari, network: tcp}
  - {name: "vless-04", type: vless, server: node04.example.com, port: 2053, uuid: "11111111-1111-1111-1111-000000000004", flow: xtls-rprx-vision, tls: true, servername: edge.example.com, client-fingerprint: chrome, network: tcp}
  - {name: "vless-05", type: vless, server: node05.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000005", flow: xtls-rprx-vision, tls: true, servername: www.example.com, client-fingerprint: chrome, network: tcp}
  - {name: "vless-06", type: vless, server: node06.example.com, port: 8443, uuid: "11111111-1111-1111-1111-000000000006", flow: xtls-rprx-vision, tls: true, servername: cdn.example.com, client-fingerprint: firefox, network: tcp}
  - {name: "vless-07", type: vless, server: node07.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000007", flow: xtls-rprx-vision, tls: true, servername: www.example.com, client-fingerprint: safari, network: tcp}
  - {name: "vless-08", type: vless, server: node08.example.com, port: 2053, uuid: "11111111-1111-1111-1111-000000000008", flow: xtls-rprx-vision, tls: true, servername: edge.example.com, client-fingerprint: chrome, network: tcp}

  # -------- VLESS over REALITY (vless-09 .. vless-12) — fabricated keys --------
  - {name: "vless-09", type: vless, server: node09.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000009", flow: xtls-rprx-vision, tls: true, servername: www.example.com, client-fingerprint: chrome, network: tcp, reality-opts: {public-key: "FAKEPUBLICKEY0000000000000000000000000000000", short-id: "a1b2c3d4"}}
  - {name: "vless-10", type: vless, server: node10.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000010", flow: xtls-rprx-vision, tls: true, servername: cdn.example.com, client-fingerprint: chrome, network: tcp, reality-opts: {public-key: "FAKEPUBLICKEY1111111111111111111111111111111", short-id: "b2c3d4e5"}}
  - {name: "vless-11", type: vless, server: node11.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000011", flow: xtls-rprx-vision, tls: true, servername: www.example.com, client-fingerprint: firefox, network: tcp, reality-opts: {public-key: "FAKEPUBLICKEY2222222222222222222222222222222", short-id: "c3d4e5f6"}}
  - {name: "vless-12", type: vless, server: node12.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000012", flow: xtls-rprx-vision, tls: true, servername: edge.example.com, client-fingerprint: safari, network: tcp, reality-opts: {public-key: "FAKEPUBLICKEY3333333333333333333333333333333", short-id: "d4e5f6a7"}}

  # -------- VLESS over WebSocket (vless-13 .. vless-16) --------
  - {name: "vless-13", type: vless, server: node13.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000013", flow: xtls-rprx-vision, tls: true, servername: ws13.example.com, client-fingerprint: chrome, network: ws, ws-opts: {path: /ws13, headers: {Host: ws13.example.com}}}
  - {name: "vless-14", type: vless, server: node14.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000014", flow: xtls-rprx-vision, tls: true, servername: ws14.example.com, client-fingerprint: firefox, network: ws, ws-opts: {path: /ws14, headers: {Host: ws14.example.com}}}
  - {name: "vless-15", type: vless, server: node15.example.com, port: 8443, uuid: "11111111-1111-1111-1111-000000000015", flow: xtls-rprx-vision, tls: true, servername: ws15.example.com, client-fingerprint: safari, network: ws, ws-opts: {path: /ws15, headers: {Host: ws15.example.com}}}
  - {name: "vless-16", type: vless, server: node16.example.com, port: 443, uuid: "11111111-1111-1111-1111-000000000016", flow: xtls-rprx-vision, tls: true, servername: ws16.example.com, client-fingerprint: chrome, network: ws, ws-opts: {path: /ws16, headers: {Host: ws16.example.com}}}

  # -------- Hysteria2 (hy2-01 .. hy2-07) --------
  - {name: "hy2-01", type: hysteria2, server: hy201.example.com, port: 443, password: "fake-hy2-pass-01", sni: hy201.example.com, skip-cert-verify: true}
  - {name: "hy2-02", type: hysteria2, server: hy202.example.com, port: 35000, password: "fake-hy2-pass-02", sni: hy202.example.com, skip-cert-verify: true}
  - {name: "hy2-03", type: hysteria2, server: hy203.example.com, port: 443, password: "fake-hy2-pass-03", sni: hy203.example.com, skip-cert-verify: true, obfs: salamander, obfs-password: "fake-obfs-pass-03"}
  - {name: "hy2-04", type: hysteria2, server: hy204.example.com, port: 35000, password: "fake-hy2-pass-04", sni: hy204.example.com, skip-cert-verify: true, obfs: salamander, obfs-password: "fake-obfs-pass-04"}
  - {name: "hy2-05", type: hysteria2, server: hy205.example.com, port: 443, password: "fake-hy2-pass-05", sni: hy205.example.com, skip-cert-verify: true, up: 50, down: 200}
  - {name: "hy2-06", type: hysteria2, server: hy206.example.com, port: 35000, password: "fake-hy2-pass-06", sni: hy206.example.com, skip-cert-verify: true, up: 30, down: 150, obfs: salamander, obfs-password: "fake-obfs-pass-06"}
  - {name: "hy2-07", type: hysteria2, server: hy207.example.com, port: 8443, password: "fake-hy2-pass-07", sni: hy207.example.com, skip-cert-verify: true}

  # -------- Port-hopping edge cases --------
  # Fixed `port` + a `ports:` range: the canonical model keeps the fixed port.
  - {name: "hy2-hop-port", type: hysteria2, server: hy2hop.example.com, port: 443, ports: "20000-21000", password: "fake-hy2-pass-hop", sni: hy2hop.example.com, skip-cert-verify: true}
  # `ports:` range with NO fixed `port`: dropped at import (non-zero port required).
  - {name: "hy2-no-port", type: hysteria2, server: hy2noport.example.com, ports: "30000-31000", password: "fake-hy2-pass-noport", sni: hy2noport.example.com, skip-cert-verify: true}

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - vless-01
      - vless-02
      - vless-03
      - vless-04
      - vless-05
      - vless-06
      - vless-07
      - vless-08
      - vless-09
      - vless-10
      - vless-11
      - vless-12
      - vless-13
      - vless-14
      - vless-15
      - vless-16
      - hy2-01
      - hy2-02
      - hy2-03
      - hy2-04
      - hy2-05
      - hy2-06
      - hy2-07
      - hy2-hop-port

  - name: AUTO
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - vless-01
      - vless-02
      - hy2-01
      - hy2-02

  - name: FALLBACK
    type: fallback
    url: http://www.gstatic.com/generate_204
    proxies:
      - hy2-03
      - hy2-04
      - hy2-hop-port
