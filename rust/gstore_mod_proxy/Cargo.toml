[package]
name = "gstore_mod_proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "GStore proxy kernel module (meow-rs based) — Android cross-compile spike"
publish = false

[lib]
name = "gstore_mod_proxy"
crate-type = ["cdylib", "rlib"]

# meow-rs is pinned by EXACT git rev (no git tags are published at this rev).
# DO NOT switch to a floating branch.  See rust/gstore_mod_proxy/SPIKE.md for
# the full dependency/feature rationale, incl. why BoringSSL is unavoidable.
#
# NOTE: the lib name of the `meow-lwip` package is `lwip`; the dependency is
# renamed here to `meow_lwip` so the spike can name the netstack crate explicitly.
[dependencies]
meow-common = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0" }
meow-tunnel = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0" }
meow-config = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0", default-features = false }
meow-proxy = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0", default-features = false }
meow-dns = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0", default-features = false }
# DomainTrie is required to construct `meow_dns::Resolver` (its `hosts` arg).
meow-trie = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0" }
# Todo 11: protect-aware subscription fetch. meow's `internal_http::fetch` is
# body-only (it discards response headers, so `Subscription-Userinfo` /
# `Content-Disposition` cannot be read) and its cap is fixed at 256 MiB
# (`fetch_capped` is private). We therefore reuse meow's protect-aware transport
# primitives directly instead of a raw reqwest client:
#   * `meow_common::connect_tcp_host` applies the host `SocketProtector` /
#     resolver hook (VpnService.protect) on every dial;
#   * `meow_transport::tls::TlsLayer` is the same BoringSSL TLS stack meow uses
#     (certificate verification always on; no `skip_cert_verify`).
# YAML parsing is still delegated to `meow_config::subscription` (no second
# YAML parser).
meow-transport = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0", default-features = false, features = ["tls"] }
# base64 decode of subscription payloads / SIP002 userinfo (already transitive;
# pinned explicitly at the version in Cargo.lock).
base64 = "0.22"
# URL parsing + percent/IDNA handling for subscription URLs and share links.
url = "2"
# Todo 9: the Clash rule engine is meow's — we only parse + orchestrate. The
# `meow-rules` crate supplies `parse_rule`/`RuleSet`/geo indexes; `serde_yaml`
# deserialises the Clash config into meow-config's own `raw::RawConfig` schema;
# `maxminddb` powers the GeoIP/ASN country index; `sha2`+`hex` verify geo
# downloads against a sha256 manifest (the app's checksum convention).
meow-rules = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0" }
serde_yaml = "0.9"
maxminddb = { version = "0.27", features = ["mmap"] }
sha2 = "0.10"
hex = "0.4"
# Todo 8: fake-IP pool prefixes (`Pool::new` takes an `ipnet::IpNet`) and
# DNS wire-format decode for the query-log record (rcode/answers). Both are
# already in the transitive graph (meow-dns depends on them); pinning them
# directly keeps the module's own use of the same versions explicit.
ipnet = "2"
hickory-proto = "0.26"
# Todo 10: meow's `ConnectionInfo.start` is an RFC3339 `SmolStr` (meow-tunnel uses
# the `time` crate to format it). We parse it back to epoch ms for `conn.list`.
# `uuid` is meow's connection key type (`Statistics::close_connection(Uuid)`).
time = { version = "0.3", features = ["parsing"] }
uuid = "1"
# Proxy registry keys are `meow_common`'s `SmolStr`-keyed map; the module builds
# that map when it attaches generated proxies/groups (`nodes::install_proxies`).
smol_str = "0.3"
meow-api = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0" }
meow-listener = { git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0", default-features = false, features = ["listener-mixed"] }
meow_lwip = { package = "meow-lwip", git = "https://github.com/meow-rs/meow-rs.git", rev = "0e718f587442caaac00b221efc91c84907aeb0e0" }

# Module ABI contract (C ABI v3: GStoreModuleEntry / Api / ModuleError / ModuleContext).
# Same shape every other downloaded module crate uses (mirrors gstore_mod_download).
gstore_contract = { path = "../gstore_contract" }
# JSON envelope (method in/out, events) — the module wire contract is JSON.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# libc malloc/free for the C ABI output buffer (who allocates frees).
libc = "0.2"

# Bounded async runtime. NEVER Runtime::new() / CPU-default workers on Android
# (SIGSEGV, see rust/gstore_mod_repo/src/lib.rs:117-120).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
futures = "0.3"

[dev-dependencies]
# Host-side dlopen integration test (mirrors gstore_host's Linux dlopen tests):
# loads target/<profile>/libgstore_mod_proxy.so as the host would.
libloading = "0.8"
# Rule-engine tests implement a named stub outbound (`meow_common::Proxy`,
# whose dial methods are `#[async_trait]`) and key the route table with SmolStr.
async-trait = "0.1"
# Connection fixtures build meow's `SmallVec<[Arc<str>; 1]>` chains directly.
smallvec = "1"

# Module crate convention (rust/ARCHITECTURE.md §3.5/§3.6): panic must unwind
# so every extern "C" boundary can catch_unwind.
[profile.release]
panic = "unwind"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
