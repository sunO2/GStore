[package]
name = "gstore_host"
version = "0.1.0"
edition = "2021"

[lib]
name = "gstore_host"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 模块契约层（独立 crate，宿主与模块 .so 共享）
gstore_contract = { path = "../gstore_contract" }
# 动态加载模块 .so（dlopen/dlsym）
libloading = "0.8"
# JSON 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Flutter FFI
flutter_rust_bridge = "=2.11.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
