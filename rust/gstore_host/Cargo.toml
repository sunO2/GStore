[package]
name = "gstore_host"
version = "0.1.0"
edition = "2021"

[lib]
name = "gstore_host"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 模块契约层（独立 crate，宿主与模块 .so 共享）
gstore_contract = { path = "../gstore_contract" }
# 动态加载模块 .so（dlopen/dlsym）
libloading = "0.8"
# JNI：Kotlin ProxyVpnService ↔ 宿主（service 引用缓存 + VpnService.protect）。
# 只用于 Android 运行时；宿主的 Linux 测试构建同样可编译（默认 feature 不含
# invocation，不链接 libjvm），JNI 函数在非 Android 上不会被调用。
jni = { version = "0.21", default-features = false }
# JSON 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Flutter FFI
flutter_rust_bridge = "=2.11.1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"], default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
