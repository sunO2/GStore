[package]
name = "gstore_mod_repo"
version = "0.1.0"
edition = "2021"

[lib]
name = "gstore_mod_repo"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 模块契约层（C ABI 结构体）
gstore_contract = { path = "../gstore_contract" }
# JSON（响应编码）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# async 运行时（download_repo 跨 C ABI block_on）
tokio = { version = "1", features = ["full"] }
# HTTP 客户端（index 下载）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# ZIP/XML 解析（index-v1.jar / index-v1.xml）
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# SQLite（仓库索引库）
rusqlite = { version = "0.32", features = ["bundled"] }
# libc malloc/free
libc = "0.2"
# 日志
log = "0.4"

[profile.release]
panic = "unwind"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
