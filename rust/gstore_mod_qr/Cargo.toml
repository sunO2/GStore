[package]
name = "gstore_mod_qr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gstore_mod_qr"
crate-type = ["cdylib"]

[dependencies]
# 模块契约层（C ABI 结构体、错误模型）
gstore_contract = { path = "../gstore_contract" }
# 二维码解码（zxing-cpp C++ 核心，bundled 自动编译静态链接）
zxing-cpp = { version = "0.5", features = ["bundled"] }
# JSON（响应编码）
serde_json = "1.0"
# libc malloc/free（跨 .so 边界内存配对）
libc = "0.2"

# 模块发布构建：panic 必须 unwind（宿主是 abort），边界 catch_unwind 兜底
[profile.release]
panic = "unwind"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# 本地快速验证 profile：thin LTO + 多 codegen unit，明显快于发布用 fat LTO。
# 发布/CI 仍使用 [profile.release]；切换方式：GSTORE_RUST_PROFILE=release-fast。
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 8
