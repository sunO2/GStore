# Supply-chain advisory baseline for every Rust crate in this repository.
#
# This file is the machine-readable half of rust/deny.toml.  cargo-deny does not
# support a `review_date` key, so the review dates live here (and only here);
# deny.toml keeps the human-readable prose.  scripts/qa/supply-chain.sh parses
# this file with Python's TOML parser and treats it as the ONLY source of
# accepted findings -- it never scrapes ids out of deny.toml comments.
#
# Two sections:
#
#   [[finding]]     accepted-but-BLOCKING findings.  They are real, they are in
#                   the resolved graph, and they are NOT ignored by cargo-deny.
#                   The gate reports them and exits 3 (BLOCKED) until the
#                   out-of-scope dependency refresh lands.
#
#   [[suppressed]]  findings that are provably not exploitable in this tree
#                   (lockfile-only / unreachable / unmaintained / yanked).  They
#                   are also listed in [advisories].ignore in rust/deny.toml;
#                   the gate asserts the two lists are identical.
#
# Every entry carries the crates that are actually on an affected version
# (`applies_to`, derived from each crate's Cargo.lock -- not guessed) and a
# `review_date` that the gate enforces: a passed date is a hard FAIL.
#
# Changing a dependency version without updating this file is also a FAIL: the
# gate compares the observed crate@version set against `applies_to`.

