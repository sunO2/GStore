[package]
name = "gstore_contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gstore_contract"

[dependencies]
# JSON 信封（P1 过渡实现，切 protobuf 时换 prost + 结构不变）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 日志 trait（HostLogger 实现 log::Log；std 启用 set_boxed_logger）
log = { version = "0.4", features = ["std"] }
prost = { version = "0.14.4", default-features = true, features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"], default-features = false }
sha2 = "0.11.0"
hex = "0.4.3"
rand_core = { version = "0.6", features = ["std"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[lints.rust]
# `dynamic-pb` is a deliberately optional cfg gate for the OUT_DIR-generated
# prost module in src/lib.rs. Declare it as an expected feature value so
# rustc's check-cfg does not flag it while the backing feature is opt-in.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dynamic-pb"))'] }

[dev-dependencies]
# dlopen the compiled ABI v4 fixture (tests/abi_v5.rs).
libloading = "0.8"
