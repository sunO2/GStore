on: push
name: build and test app
jobs:
  build:
    name: install dependencies
    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 完整 git 历史：release notes 需要上一 tag 之后的所有 commits

      - name: Free disk space (Flutter+Rust Android build needs ~20GB)
        run: |
          echo "=== Before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After ==="
          df -h /

      - name: Download Latest apps.db Asset from sunO2/GStore-repositorys Release
        run: |
          REPO_OWNER="sunO2"
          REPO_NAME="GStore-repositorys"
          ASSET_NAME="apps.db" # Replace with the actual asset name if different

          RELEASE_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest")
          ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[] | select(.name == \"$ASSET_NAME\") | .browser_download_url")

          if [[ -z "$ASSET_URL" ]]; then
            echo "::warning::No asset named '$ASSET_NAME' found in latest release of sunO2/GStore-repositorys. Using existing apps.db or workflow might fail if it's missing."
            exit 0 # Continue workflow, but warn that apps.db update might have failed
          fi

          echo "Downloading asset '$ASSET_NAME' from: $ASSET_URL"
          curl -L -o downloaded_apps.db "$ASSET_URL" # Download asset to 'downloaded_apps.db'

          mkdir -p assets/app/db
          cp downloaded_apps.db assets/app/db/apps.db # Copy downloaded asset to destination, renaming it to apps.db
          echo "Successfully updated assets/app/db/apps.db from release asset"


      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ./pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      # Cache flutter dependencies for faster builds
      - name: Cache Flutter pub
        uses: actions/cache@v6
        id: flutter-pub-cache
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      - name: Install dependencies
        run: flutter pub get
      - run: flutter test
      - run: flutter build apk --no-shrink --target-platform android-arm,android-arm64,android-x64 --split-per-abi 
      - run: flutter build appbundle
      
      - name: Get previous release tag
        id: prev_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 取最近一次 release 的 tag（当前 release 尚未创建，latest 即上一次打包）
          PREV=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: $PREV"

      - name: Resolve note range (tag push)
        id: note_range
        run: |
          # 推送的是 tag（打包 tag，如 refs/tags/v1.0.26）：
          #   终点 = 该 tag 指向的 commit（GITHUB_SHA）
          #   起点 = 该 tag 之前最近的版本 tag（v 开头）的 commit
          # 分支 push（无 tag）：保留原逻辑起点 = 上一个 release tag，终点 = HEAD
          REF="$GITHUB_REF"
          if [[ "$REF" == refs/tags/* ]]; then
            END_COMMIT="${GITHUB_SHA}"
            # 取当前 tag 之前最近的 v* tag（排除当前 tag 与非版本 tag）
            START_TAG=$(git tag --sort=-creatordate --merged "${END_COMMIT}" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -v "^${REF#refs/tags/}$" \
              | head -n 1 || true)
            if [[ -n "$START_TAG" ]]; then
              START_COMMIT=$(git rev-list -n 1 "$START_TAG")
            else
              # 首个版本 tag：无更早 v tag 可对比，起点为空 → 空日志由后续处理
              START_COMMIT=""
            fi
            echo "range_kind=tag" >> "$GITHUB_OUTPUT"
            echo "start_commit=$START_COMMIT" >> "$GITHUB_OUTPUT"
            echo "end_commit=$END_COMMIT" >> "$GITHUB_OUTPUT"
            echo "start_tag=$START_TAG" >> "$GITHUB_OUTPUT"
            echo "Tag push: notes range ${START_TAG:-∅}..${REF#refs/tags/}"
          else
            # 分支 push：走原逻辑（上一个 release tag → HEAD）
            echo "range_kind=branch" >> "$GITHUB_OUTPUT"
            echo "Tag push? No (branch ${REF#refs/heads/})"
          fi

      - name: Generate release notes
        id: get_notes
        run: |
          KIND="${{ steps.note_range.outputs.range_kind }}"
          if [[ "$KIND" == "tag" ]]; then
            START="${{ steps.note_range.outputs.start_commit }}"
            END="${{ steps.note_range.outputs.end_commit }}"
            if [[ -n "$START" && -n "$END" && "$START" != "$END" ]]; then
              # 上一个版本 tag 的 commit → 本次 tag 的 commit 之间的日志（不含更早全量）
              git log "$START..$END" --pretty=format:"* %s" > notes.txt
              echo "tag range: $START..$END"
            else
              # 首个版本 tag / 无更早 tag：该 tag 起全量（或空则占位）
              : > notes.txt
              echo "* 无新增提交（首个版本或区间为空）" > notes.txt
            fi
          else
            # 分支 push：原逻辑（上一次 release tag 之后的所有 commit，无则全量）
            CURRENT="v${{ steps.get_version.outputs.version }}"
            PREV="${{ steps.prev_release.outputs.prev_tag }}"
            if [[ -n "$PREV" && "$PREV" != "$CURRENT" ]]; then
              git log "$PREV..HEAD" --pretty=format:"* %s" > notes.txt
            else
              git log --pretty=format:"* %s" > notes.txt
            fi
          fi
          echo "--- release notes ---"
          cat notes.txt
          echo "---------------------"
          if [[ ! -s notes.txt ]]; then
            echo "* 无新增提交" > notes.txt
          fi
          
      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 官方 create-release@v1 已弃用，改用内置 gh CLI（幂等：tag 已存在时回退 edit）
          gh release create "v${{ steps.get_version.outputs.version }}" \
            --title "${{ steps.get_version.outputs.version }}" \
            --notes-file notes.txt \
            --target "${GITHUB_SHA}" \
            --draft=false \
            --prerelease=false \
          || gh release edit "v${{ steps.get_version.outputs.version }}" \
            --notes-file notes.txt
      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 官方 upload-release-asset@v1 已弃用，改用 gh release upload（file#name 保留原资产名）
          gh release upload "v${{ steps.get_version.outputs.version }}" \
            "./build/app/outputs/bundle/release/app-release.aab#app-release.aab" \
            "./build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk#GStore-armeabi-v7a-release.apk" \
            "./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#GStore-arm64-v8a-release.apk" \
            "./build/app/outputs/flutter-apk/app-x86_64-release.apk#GStore-x86_64-release.apk" \
            --clobber
