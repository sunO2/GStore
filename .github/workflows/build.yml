on: push
name: build and test app
jobs:
  build:
    name: install dependencies
    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clone repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 完整 git 历史：release notes 需要上一 tag 之后的所有 commits

      - name: Free disk space (Flutter+Rust Android build needs ~20GB)
        run: |
          echo "=== Before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After ==="
          df -h /

      # ── Rust Android 模块构建所需工具链 ──────────────────────────────────
      - name: Set up Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          # build_android_rust.sh 会为这 4 个 target 构建宿主 + qr/analyzer/repo/download 模块
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 26.3.11579264

      - name: Set up CMake and Ninja (zxing-cpp cmake cross-build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Download Latest apps.db Asset from sunO2/GStore-repositorys Release
        run: |
          REPO_OWNER="sunO2"
          REPO_NAME="GStore-repositorys"
          ASSET_NAME="apps.db" # Replace with the actual asset name if different

          RELEASE_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/latest")
          ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[] | select(.name == \"$ASSET_NAME\") | .browser_download_url")

          if [[ -z "$ASSET_URL" ]]; then
            echo "::warning::No asset named '$ASSET_NAME' found in latest release of sunO2/GStore-repositorys. Using existing apps.db or workflow might fail if it's missing."
            exit 0 # Continue workflow, but warn that apps.db update might have failed
          fi

          echo "Downloading asset '$ASSET_NAME' from: $ASSET_URL"
          curl -L -o downloaded_apps.db "$ASSET_URL" # Download asset to 'downloaded_apps.db'

          mkdir -p assets/app/db
          cp downloaded_apps.db assets/app/db/apps.db # Copy downloaded asset to destination, renaming it to apps.db
          echo "Successfully updated assets/app/db/apps.db from release asset"


      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ./pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      # Cache flutter dependencies for faster builds
      - name: Cache Flutter pub
        uses: actions/cache@v6
        id: flutter-pub-cache
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      - name: Install dependencies
        run: flutter pub get
      # 用「上游 it-tools + 补丁」重建离线包（产物直接落到 assets/it_tools/）
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Rebuild it-tools offline bundle (upstream + patch)
        run: bash scripts/it_tools/build_bundle.sh

      # 构建可下载 Rust 模块。llm 为可选、仅 arm64，由脚本既有逻辑决定是否构建，
      # 不纳入下方断言范围。
      - name: Build Rust Android modules (qr/analyzer/repo/download)
        env:
          GSTORE_NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          GSTORE_PROJECT_DIR: ${{ github.workspace }}/rust/gstore_host
          GSTORE_LIB_DIR: ${{ github.workspace }}/android/app/src/main/jniLibs
          GSTORE_MODULE_DIR: ${{ github.workspace }}/rust/release-modules
        run: bash build_android_rust.sh

      # 非零字节断言：任一模块/ABI 产物缺失或为零字节都会让作业失败。
      - name: Assert Rust module artifacts are present and non-zero
        env:
          GSTORE_MODULE_DIR: ${{ github.workspace }}/rust/release-modules
        run: bash scripts/ci/assert_module_artifacts.sh "$GSTORE_MODULE_DIR"

      # 由本次构建产物生成发布清单：modules.json（v2，上传到 Release）
      # 与 assets/app/modules_builtin.json（随 APK 打包的内置版本兜底）。
      - name: Generate module manifest (modules.json + modules_builtin.json)
        env:
          GSTORE_MODULE_DIR: ${{ github.workspace }}/rust/release-modules
        run: bash generate_modules_manifest.sh "$GSTORE_MODULE_DIR"

      # 暂时禁用 flutter test（宿主/CI 环境缺失 libsqlite3.so 导致大量 DB 用例失败）；
      # 恢复时取消下面一行注释即可。
      # - run: flutter test

      # 完整包：内置全部可下载模块 .so（保持既有行为与发布文件名）。
      - name: Build full APKs (bundled modules)
        run: flutter build apk --no-shrink --target-platform android-arm,android-arm64,android-x64 --split-per-abi

      # 产物固定写到 flutter-apk/app-<abi>-release.apk；立即改名暂存，避免随后精简包
      # 的同名产物覆盖，发布上传统一走暂存目录。
      - name: Stage full APK assets
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk"
          DEST="build/apk-release"
          mkdir -p "$DEST"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$SRC/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "ERROR: 完整包产物缺失: $src" >&2
              exit 1
            fi
            cp "$src" "$DEST/GStore-${abi}-release.apk"
          done

      - run: flutter build appbundle

      # 精简包：Gradle 打包排除 libgstore_mod_*.so（仅保留 libgstore_host.so），
      # 模块改为首次使用时远程下载。
      - name: Build slim APKs (host-only, modules excluded)
        env:
          ORG_GRADLE_PROJECT_gstoreSlimModules: "true"
        run: flutter build apk --no-shrink --target-platform android-arm,android-arm64,android-x64 --split-per-abi

      - name: Stage slim APK assets
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk"
          DEST="build/apk-release"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$SRC/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "ERROR: 精简包产物缺失: $src" >&2
              exit 1
            fi
            cp "$src" "$DEST/GStore-slim-${abi}-release.apk"
          done

      # 载荷断言：完整包须含 4 个模块 .so + host；精简包须不含模块 .so 但含 host。
      - name: Assert APK module payload (full vs slim)
        run: bash scripts/ci/assert_apk_module_payload.sh build/apk-release
      
      - name: Get previous release tag
        id: prev_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 取最近一次 release 的 tag（当前 release 尚未创建，latest 即上一次打包）
          PREV=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: $PREV"

      - name: Resolve note range (tag push)
        id: note_range
        run: |
          # 推送的是 tag（打包 tag，如 refs/tags/v1.0.26）：
          #   终点 = 该 tag 指向的 commit（GITHUB_SHA）
          #   起点 = 该 tag 之前最近的版本 tag（v 开头）的 commit
          # 分支 push（无 tag）：保留原逻辑起点 = 上一个 release tag，终点 = HEAD
          REF="$GITHUB_REF"
          if [[ "$REF" == refs/tags/* ]]; then
            END_COMMIT="${GITHUB_SHA}"
            # 取当前 tag 之前最近的 v* tag（排除当前 tag 与非版本 tag）
            START_TAG=$(git tag --sort=-creatordate --merged "${END_COMMIT}" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -v "^${REF#refs/tags/}$" \
              | head -n 1 || true)
            if [[ -n "$START_TAG" ]]; then
              START_COMMIT=$(git rev-list -n 1 "$START_TAG")
            else
              # 首个版本 tag：无更早 v tag 可对比，起点为空 → 空日志由后续处理
              START_COMMIT=""
            fi
            echo "range_kind=tag" >> "$GITHUB_OUTPUT"
            echo "start_commit=$START_COMMIT" >> "$GITHUB_OUTPUT"
            echo "end_commit=$END_COMMIT" >> "$GITHUB_OUTPUT"
            echo "start_tag=$START_TAG" >> "$GITHUB_OUTPUT"
            echo "Tag push: notes range ${START_TAG:-∅}..${REF#refs/tags/}"
          else
            # 分支 push：走原逻辑（上一个 release tag → HEAD）
            echo "range_kind=branch" >> "$GITHUB_OUTPUT"
            echo "Tag push? No (branch ${REF#refs/heads/})"
          fi

      - name: Generate release notes
        id: get_notes
        run: |
          KIND="${{ steps.note_range.outputs.range_kind }}"
          if [[ "$KIND" == "tag" ]]; then
            START="${{ steps.note_range.outputs.start_commit }}"
            END="${{ steps.note_range.outputs.end_commit }}"
            if [[ -n "$START" && -n "$END" && "$START" != "$END" ]]; then
              # 上一个版本 tag 的 commit → 本次 tag 的 commit 之间的日志（不含更早全量）
              git log "$START..$END" --pretty=format:"* %s" > notes.txt
              echo "tag range: $START..$END"
            else
              # 首个版本 tag / 无更早 tag：该 tag 起全量（或空则占位）
              : > notes.txt
              echo "* 无新增提交（首个版本或区间为空）" > notes.txt
            fi
          else
            # 分支 push：原逻辑（上一次 release tag 之后的所有 commit，无则全量）
            CURRENT="v${{ steps.get_version.outputs.version }}"
            PREV="${{ steps.prev_release.outputs.prev_tag }}"
            if [[ -n "$PREV" && "$PREV" != "$CURRENT" ]]; then
              git log "$PREV..HEAD" --pretty=format:"* %s" > notes.txt
            else
              git log --pretty=format:"* %s" > notes.txt
            fi
          fi
          echo "--- release notes ---"
          cat notes.txt
          echo "---------------------"
          if [[ ! -s notes.txt ]]; then
            echo "* 无新增提交" > notes.txt
          fi
          
      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 官方 create-release@v1 已弃用，改用内置 gh CLI（幂等：tag 已存在时回退 edit）
          gh release create "v${{ steps.get_version.outputs.version }}" \
            --title "${{ steps.get_version.outputs.version }}" \
            --notes-file notes.txt \
            --target "${GITHUB_SHA}" \
            --draft=false \
            --prerelease=false \
          || gh release edit "v${{ steps.get_version.outputs.version }}" \
            --notes-file notes.txt
      # 同一 Release 上传顺序固定：本次新版 .so（版本化名，--clobber）→ modules.json（提交标记）
      # → APK/AAB 与 it-tools → 最后按留存策略清理旧模块资产。
      # 约定：任何模块内容变更必须提升模块 version；--clobber 仅用于同版本重建兜底，客户端按
      # Todo 5「同版本但 sha256 变化」规则仍能取到修正。
      - name: Upload Rust module .so assets (per-ABI, versioned, clobber)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSTORE_MODULE_DIR: ${{ github.workspace }}/rust/release-modules
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"
          MANIFEST="$GSTORE_MODULE_DIR/modules.json"
          python3 - "$MANIFEST" > module_assets.tsv <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          for name, mod in sorted(manifest.get("modules", {}).items()):
              for abi, entry in sorted(mod.get("abi", {}).items()):
                  print(f"{name}\t{abi}\t{entry['asset']}\t{entry['sha256']}\t{entry['size']}")
          PY
          if [ ! -s module_assets.tsv ]; then
            echo "ERROR: modules.json 中没有任何模块资产，拒绝发布" >&2
            exit 1
          fi
          while IFS=$'\t' read -r name abi asset sha size; do
            [ -n "$name" ] || continue
            src="$GSTORE_MODULE_DIR/$abi/libgstore_mod_$name.so"
            if [ ! -s "$src" ]; then
              echo "ERROR: 模块产物缺失或零字节: $src" >&2
              exit 1
            fi
            actual_sha="$(sha256sum "$src" | cut -d' ' -f1)"
            actual_size="$(stat -c%s "$src")"
            if [ "$actual_sha" != "$sha" ] || [ "$actual_size" != "$size" ]; then
              echo "ERROR: 产物与清单 sha256/size 不符: $src" >&2
              exit 1
            fi
            gh release upload "$TAG" "$src#$asset" --clobber
          done < module_assets.tsv

      - name: Upload modules.json (commit marker after .so, clobber)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSTORE_MODULE_DIR: ${{ github.workspace }}/rust/release-modules
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"
          gh release upload "$TAG" "$GSTORE_MODULE_DIR/modules.json#modules.json" --clobber

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 官方 upload-release-asset@v1 已弃用，改用 gh release upload（file#name 保留原资产名）
          # 完整包与精简包均取自暂存目录（flutter-apk 下同名文件已被精简包覆盖）。
          gh release upload "v${{ steps.get_version.outputs.version }}" \
            "./build/app/outputs/bundle/release/app-release.aab#app-release.aab" \
            "./build/apk-release/GStore-armeabi-v7a-release.apk#GStore-armeabi-v7a-release.apk" \
            "./build/apk-release/GStore-arm64-v8a-release.apk#GStore-arm64-v8a-release.apk" \
            "./build/apk-release/GStore-x86_64-release.apk#GStore-x86_64-release.apk" \
            "./build/apk-release/GStore-slim-armeabi-v7a-release.apk#GStore-slim-armeabi-v7a-release.apk" \
            "./build/apk-release/GStore-slim-arm64-v8a-release.apk#GStore-slim-arm64-v8a-release.apk" \
            "./build/apk-release/GStore-slim-x86_64-release.apk#GStore-slim-x86_64-release.apk" \
            --clobber

      - name: Upload it-tools assets (exempt from retention)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"
          gh release upload "$TAG" \
            "assets/it_tools/it-tools.zip#it-tools.zip" \
            "assets/it_tools/it_tools.json#it_tools.json" \
            --clobber

      # 登录后（GITHUB_TOKEN 已认证）仅删除：早于清单 TTL、且不被本次 modules.json 引用、
      # 且属于模块 .so 的资产。it-tools 资产豁免，绝不在清理范围内。
      - name: Prune stale module assets (TTL + manifest reference, it-tools exempt)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_MANIFEST_TTL_DAYS: "30"
          GSTORE_MODULE_DIR: ${{ github.workspace }}/rust/release-modules
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"
          MANIFEST="$GSTORE_MODULE_DIR/modules.json"
          TTL_DAYS="${MODULE_MANIFEST_TTL_DAYS:-30}"
          NOW_EPOCH="$(date -u +%s)"
          python3 - "$MANIFEST" > referenced_assets.txt <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          for mod in manifest.get("modules", {}).values():
              for entry in mod.get("abi", {}).values():
                  print(entry["asset"])
          PY
          gh release view "$TAG" --json assets \
            --jq '.assets[] | [.name, .createdAt] | @tsv' > release_assets.tsv
          while IFS=$'\t' read -r name created_at; do
            [ -n "$name" ] || continue
            case "$name" in
              it-tools.zip|it_tools.json)
                echo "skip exempt it-tools asset: $name"
                continue
                ;;
            esac
            case "$name" in
              libgstore_mod_*.so) ;;
              *)
                echo "skip non-module asset: $name"
                continue
                ;;
            esac
            if grep -Fxq "$name" referenced_assets.txt; then
              echo "skip referenced module asset: $name"
              continue
            fi
            created_epoch="$(date -u -d "$created_at" +%s)"
            age_days=$(( (NOW_EPOCH - created_epoch) / 86400 ))
            if [ "$age_days" -ge "$TTL_DAYS" ]; then
              gh release delete-asset "$TAG" "$name" --yes
              echo "deleted stale module asset: $name (age=${age_days}d TTL=${TTL_DAYS}d)"
            else
              echo "keep recent module asset: $name (age=${age_days}d < TTL=${TTL_DAYS}d)"
            fi
          done < release_assets.tsv
